apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-frontend
  labels:
    app: research-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: research-frontend
  template:
    metadata:
      labels:
        app: research-frontend
    spec:
      containers:
        - name: frontend
          image: myregistry/research-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.example.com"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: research-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
