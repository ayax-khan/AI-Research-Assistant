apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-backend
  labels:
    app: research-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: research-backend
  template:
    metadata:
      labels:
        app: research-backend
    spec:
      containers:
        - name: backend
          image: myregistry/research-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: url
            - name: QDRANT_HOST
              value: qdrant-service
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: openai-api-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: research-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
